spring:
  application:
    name: sae-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sae_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# JWT emitido localmente (login legacy durante la transición; se elimina en Fase 6)
jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWJhc2U2NC1wYXlsb2FkLXNlY3JldC1rZXk=}
  expiration-ms: 86400000

app:
  periodo-activo: ${PERIODO_ACTIVO:05-2026}

  # IDP: Keycloak (OIDC Resource Server)
  keycloak:
    issuer-uri: ${KC_ISSUER_URI:http://localhost:8081/realms/sae_realm}
    jwk-set-uri: ${KC_JWKS_URI:http://localhost:8081/realms/sae_realm/protocol/openid-connect/certs}